<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Protegiendo el Ñembi Guasu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: pantalla de juego 16:9 centrada. En pantallas táctiles se suman un joystick (izquierda)
   y botones de acción (derecha): a los costados en horizontal, debajo del juego en vertical.
   Estética fija de bosque seco nocturno, por eso un solo tema oscuro. */
:root{
  --bg:#101a14;
  --panel:#1c2b21;
  --ink:#f1e7c9;
  --muted:#aab59c;
  --accent:#e9a43b;
  --line:#34493b;
  --act:#7a4a18;
  --act-held:#a4621e;
  --sel:#4a4220;
  --sel-line:#ffd36a;
  --font-ui:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-px:"Lucida Console","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-sizing:border-box;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
#stage{width:100%;max-width:1280px;display:flex;justify-content:center;align-items:center;gap:14px;min-width:0}
#wrap{width:100%;min-width:0;max-width:min(1280px,calc((100vh - 96px) * 16 / 9));max-width:min(1280px,calc((100dvh - 96px) * 16 / 9))}
#game{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;
  background:#000;border:2px solid var(--line);border-radius:4px;box-sizing:border-box}
#game:focus{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;
  width:100%;max-width:1280px;font-size:13px;color:var(--muted);line-height:1.8}
.bar button,.sbtn,.tbtn{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer}
.bar button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--font-px);font-size:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;padding:0 5px;color:var(--ink)}

/* --- Controles táctiles (solo con body.touch) --- */
.touch-only,.rotate{display:none}
.touch-only{flex-direction:column;align-items:center;gap:8px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#joy{position:relative;width:116px;height:116px;border-radius:50%;flex:none;
  background:radial-gradient(circle,var(--panel) 0 58%,var(--bg) 60%);border:2px solid var(--line);touch-action:none}
#joy::before{content:"";position:absolute;inset:12px;border-radius:50%;border:1px dashed var(--line)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
  background:var(--panel);border:2px solid var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.5);pointer-events:none}
#joy.active{border-color:var(--accent)}
#joy.active #knob{background:var(--act)}
.sys,.tools{display:flex;gap:6px}
.sbtn{font-size:12px;padding:0;width:55px;height:32px}
.tbtn{width:50px;height:46px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font-px);font-size:15px;font-weight:bold;line-height:1.1}
.tbtn small,#actBtn small{font-family:var(--font-ui);font-weight:normal;font-size:10px;color:var(--muted)}
.tbtn[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line)}
.tbtn[aria-pressed="true"] small{color:var(--ink)}
#actBtn{width:90px;height:90px;border-radius:50%;padding:0;cursor:pointer;
  background:var(--act);border:3px solid var(--accent);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.5);
  font-family:var(--font-px);font-size:28px;font-weight:bold;line-height:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#actBtn small{font-size:11px;font-weight:bold;color:var(--ink);max-width:82px;text-align:center}
.held,#actBtn.held{background:var(--act-held);transform:translateY(2px)}
.rotate{margin:0;font-size:13px;color:var(--muted);text-align:center}

body.touch .bar{display:none}
body.touch .touch-only{display:flex}
body.touch #stage{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"game game" "pad btns";align-items:center;gap:14px 12px}
body.touch #wrap{grid-area:game;max-width:100%}
body.touch #padZone{grid-area:pad;justify-self:start}
body.touch #btnZone{grid-area:btns;justify-self:end}
@media (orientation:landscape){
  body.touch #stage{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pad game btns";max-width:none}
  body.touch #wrap{justify-self:center;max-width:calc((100vh - 28px) * 16 / 9);max-width:calc((100dvh - 28px) * 16 / 9)}
}
@media (orientation:portrait){ body.touch .rotate{display:block} }
@media (prefers-reduced-motion:reduce){ .held,#actBtn.held{transform:none} }
</style>
</head>
<body>
<div id="stage">
  <div id="padZone" class="touch-only">
    <div id="joy" aria-label="Joystick: arrastra para caminar"><div id="knob"></div></div>
    <div class="sys">
      <button id="pauseBtn" class="sbtn" type="button">Pausa</button>
      <button id="muteBtn2" class="sbtn" type="button" aria-pressed="false">Sonido</button>
    </div>
  </div>
  <div id="wrap">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Juego: Protegiendo el Ñembi Guasu. Se juega con teclado o con controles táctiles."></canvas>
  </div>
  <div id="btnZone" class="touch-only">
    <div class="tools">
      <button class="tbtn" type="button" data-tool="1" aria-pressed="true">1<small>Cámara</small></button>
      <button class="tbtn" type="button" data-tool="2" aria-pressed="false">2<small id="waterLbl">Agua 10</small></button>
      <button class="tbtn" type="button" data-tool="3" aria-pressed="false">3<small>Rastrillo</small></button>
    </div>
    <button id="actBtn" type="button" aria-label="Acción (E)">E<small id="actLbl">Usar</small></button>
  </div>
</div>
<p class="rotate">Gira el teléfono a horizontal para ver mejor el juego.</p>
<div class="bar">
  <button id="muteBtn" type="button" aria-pressed="false">Sonido: activado</button>
  <span><kbd>WASD</kbd>/<kbd>Flechas</kbd> mover · <kbd>E</kbd> usar / hablar · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> herramienta · <kbd>M</kbd> silenciar · <kbd>P</kbd> pausa</span>
  <span>Si el teclado no responde, haz clic sobre el juego.</span>
</div>

<script>
'use strict';
/* =====================================================================
   PROTEGIENDO EL ÑEMBI GUASU  (campamento base: Ñembi Misi)
   Secciones:
   1. Configuración        6. Mapa y mundo        11. HUD
   2. Utilidades           7. Entidades           12. Pantallas
   3. Audio                8. Fuego               13. Bucle principal
   4. Entrada (teclado)    9. Eventos del día
   5. Sprites (pixel art) 10. Interacción y herramientas
   ===================================================================== */

/* ===================== 1. CONFIGURACIÓN ===================== */
const CFG = {
  W: 960, H: 540, SCALE: 3, TILE: 16,
  MAP_W: 56, MAP_H: 40,
  DAY_SECONDS: 240,              // duración real de la jornada (4 min)
  DAY_START: 6 * 60,             // 06:00
  DAY_END: 20 * 60,              // 20:00
  WATER_MAX: 10,
  PLAYER_SPEED: 4.4,             // casillas por segundo
  FIRE_TICK: 1.0,                // segundos entre intentos de propagación
  FIRE_BURN_TIME: 12,            // segundos que arde una casilla de bosque
  FIRE_CORE_MULT: 2.5,           // el foco inicial arde más tiempo (evita que se apague solo)
  SPREAD: { tree: 0.032, grass: 0.055, bush: 0.05, stump: 0.02 }, // prob. de contagio por segundo
  DOC_TIME: 2.2,                 // segundos para documentar una tala
  TRUST_START: 30,
  TIP_TRUST: 45,                 // confianza a partir de la cual los vecinos avisan
};
const T = CFG.TILE, S = CFG.SCALE;
const VIEW_W = CFG.W / S, VIEW_H = CFG.H / S;
const MIN_PER_SEC = (CFG.DAY_END - CFG.DAY_START) / CFG.DAY_SECONDS;

// Tipos de casilla
const TL = { GRASS:0, TREE:1, PATH:2, STUMP:3, BURNT:4, BREAK:5, WATER:6, FLOOR:7,
             BUILDING:8, VILLAGE:9, FENCE:10, ROCK:11, BUSH:12 };
// solid: bloquea el paso · speed: multiplicador de velocidad · fuel: tipo de combustible
const TILE_INFO = {
  [TL.GRASS]:   { solid:false, speed:1.0,  fuel:'grass' },
  [TL.TREE]:    { solid:false, speed:0.6,  fuel:'tree'  },
  [TL.PATH]:    { solid:false, speed:1.25, fuel:null    },
  [TL.STUMP]:   { solid:false, speed:0.85, fuel:'stump' },
  [TL.BURNT]:   { solid:false, speed:0.95, fuel:null    },
  [TL.BREAK]:   { solid:false, speed:1.05, fuel:null    },
  [TL.WATER]:   { solid:true,  speed:0,    fuel:null    },
  [TL.FLOOR]:   { solid:false, speed:1.2,  fuel:null    },
  [TL.BUILDING]:{ solid:true,  speed:0,    fuel:null    },
  [TL.VILLAGE]: { solid:false, speed:1.15, fuel:null    },
  [TL.FENCE]:   { solid:true,  speed:0,    fuel:null    },
  [TL.ROCK]:    { solid:true,  speed:0,    fuel:null    },
  [TL.BUSH]:    { solid:false, speed:0.8,  fuel:'bush'  },
};
const TOOLS = [
  { id:1, name:'Cámara',   hint:'Mantén E junto a un claro talado' },
  { id:2, name:'Agua',     hint:'E: rociar la casilla de enfrente' },
  { id:3, name:'Rastrillo',hint:'Mantén E: limpiar para cortafuego' },
];

/* ===================== 2. UTILIDADES ===================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = Math.random;
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
// Direcciones (índice 0 = Norte, en sentido horario)
const DIR_NAMES = ['norte','noreste','este','sureste','sur','suroeste','oeste','noroeste'];
const DIR_SHORT = ['N','NE','E','SE','S','SO','O','NO'];
const DIR_VEC = DIR_NAMES.map((_, i) => { const a = i * Math.PI / 4; return { x: Math.sin(a), y: -Math.cos(a) }; });
function dirIndex(dx, dy) { const a = Math.atan2(dx, -dy); return ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8; }
function fmtClock(min) { const h = Math.floor(min / 60), m = Math.floor(min % 60); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }

/* ===================== 3. AUDIO (Web Audio API) ===================== */
const Sound = {
  ctx: null, master: null, muted: false, noiseBuf: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(freq, dur, type = 'square', vol = 0.2, slideTo = null, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol = 0.2, freq = 1000, ftype = 'lowpass', delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.03);
  },
  chainsaw(vol) {
    if (!this.ctx || this.muted || vol < 0.02) return;
    const t = this.ctx.currentTime, dur = 1.1;
    const o = this.ctx.createOscillator(), lfo = this.ctx.createOscillator();
    const lg = this.ctx.createGain(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(85, t); o.frequency.linearRampToValueAtTime(130, t + 0.3);
    o.frequency.linearRampToValueAtTime(110, t + dur);
    lfo.frequency.value = 22; lg.gain.value = 25; lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 900 + 1200 * vol;
    g.gain.setValueAtTime(0.0008, t); g.gain.linearRampToValueAtTime(0.16 * vol, t + 0.08);
    g.gain.setValueAtTime(0.16 * vol, t + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  },
  sfx(name, vol = 1) {
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'blip':    this.tone(660, 0.06, 'square', 0.10 * vol); break;
      case 'select':  this.tone(520, 0.05, 'square', 0.09); this.tone(780, 0.07, 'square', 0.09, null, 0.05); break;
      case 'talk':    this.tone(280 + Math.random() * 180, 0.035, 'triangle', 0.10); break;
      case 'step':    this.noise(0.03, 0.04, 500); break;
      case 'spray':   this.noise(0.4, 0.22, 2600, 'bandpass'); this.noise(0.25, 0.08, 800, 'lowpass', 0.05); break;
      case 'hiss':    this.noise(0.5, 0.12, 5000, 'highpass'); break;
      case 'chop':    this.noise(0.07, 0.25, 700); this.tone(140, 0.08, 'square', 0.08, 70); break;
      case 'rake':    this.noise(0.12, 0.10, 1400, 'bandpass'); break;
      case 'shutter': this.noise(0.03, 0.3, 4000, 'highpass'); this.noise(0.05, 0.25, 3000, 'highpass', 0.09); break;
      case 'success': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.12, 'square', 0.08, null, i * 0.08)); break;
      case 'alert':   [880, 660, 880].forEach((f, i) => this.tone(f, 0.11, 'square', 0.09, null, i * 0.14)); break;
      case 'radio':   this.noise(0.12, 0.06, 2000, 'bandpass'); this.tone(1200, 0.05, 'square', 0.05, null, 0.12); break;
      case 'refill':  this.tone(260, 0.35, 'sine', 0.15, 620); this.noise(0.35, 0.06, 1200, 'bandpass'); break;
      case 'fail':    this.tone(220, 0.15, 'square', 0.09, 130); break;
      case 'trust':   this.tone(660, 0.1, 'triangle', 0.12); this.tone(990, 0.16, 'triangle', 0.12, null, 0.09); break;
      case 'crackle':
        for (let i = 0; i < 4; i++) this.noise(0.025, 0.14 * vol, 1200 + Math.random() * 2500, 'bandpass', Math.random() * 0.35);
        break;
      case 'end':     [392, 330, 262, 392, 523].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.12, null, i * 0.18)); break;
    }
  },
};

/* ===================== 4. ENTRADA (teclado) ===================== */
const Input = {
  down: new Set(), pressed: new Set(),
  init() {
    window.addEventListener('keydown', e => {
      const k = normKey(e);
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
      if (!this.down.has(k)) this.pressed.add(k);
      this.down.add(k);
      Sound.init(); Sound.resume();
    });
    window.addEventListener('keyup', e => this.down.delete(normKey(e)));
    window.addEventListener('blur', () => this.down.clear());
  },
  isDown(...ks) { return ks.some(k => this.down.has(k)); },
  hit(...ks) { return ks.some(k => this.pressed.has(k)); },
  endFrame() { this.pressed.clear(); },
  // Teclas virtuales (botones táctiles y toques en pantalla)
  press(k) { if (!this.down.has(k)) this.pressed.add(k); this.down.add(k); },
  release(k) { this.down.delete(k); },
  tap(k) { this.pressed.add(k); },
};
function normKey(e) { return (e.key || '').toLowerCase(); }

/* ===================== 4b. CONTROLES TÁCTILES ===================== */
// Joystick (izquierda) + botón E, herramientas, pausa y sonido (derecha/izquierda).
// Se activan solos en pantallas táctiles o al primer toque.
const Touch = {
  on: false, jx: 0, jy: 0, joyId: null, last: {},
  enable() { if (this.on) return; this.on = true; document.body.classList.add('touch'); },
  init() {
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) this.enable();
    window.addEventListener('touchstart', () => this.enable(), { once: true, passive: true });
    const unlock = () => { Sound.init(); Sound.resume(); };
    for (const ev of ['touchend', 'click', 'pointerdown']) document.addEventListener(ev, unlock, { passive: true });
    // Joystick analógico
    const joy = document.getElementById('joy'), knob = document.getElementById('knob'), REACH = 40;
    const setKnob = () => { knob.style.transform = `translate(${this.jx * REACH}px, ${this.jy * REACH}px)`; };
    const move = e => {
      const r = joy.getBoundingClientRect();
      let dx = (e.clientX - (r.left + r.width / 2)) / REACH, dy = (e.clientY - (r.top + r.height / 2)) / REACH;
      const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
      this.jx = dx; this.jy = dy; setKnob();
    };
    joy.addEventListener('pointerdown', e => { e.preventDefault(); this.enable(); this.joyId = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (_) {} joy.classList.add('active'); move(e); });
    joy.addEventListener('pointermove', e => { if (e.pointerId === this.joyId) move(e); });
    const end = e => { if (e.pointerId !== this.joyId) return; this.joyId = null; this.jx = this.jy = 0; setKnob(); joy.classList.remove('active'); };
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) joy.addEventListener(ev, end);
    // Botones que se pueden mantener presionados (E para documentar o limpiar)
    const holdBtn = (el, keyFn) => {
      el.addEventListener('pointerdown', e => {
        e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {}
        el._key = keyFn(); el.classList.add('held'); Input.press(el._key);
      });
      const up = () => { if (!el._key) return; el.classList.remove('held'); Input.release(el._key); el._key = null; };
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, up);
    };
    holdBtn(document.getElementById('actBtn'), () => Game.state === 'play' ? 'e' : Game.state === 'paused' ? 'p' : 'enter');
    this.tbtns = [...document.querySelectorAll('.tbtn')];
    for (const b of this.tbtns) holdBtn(b, () => b.dataset.tool);
    holdBtn(document.getElementById('pauseBtn'), () => 'p');
    document.getElementById('muteBtn2').addEventListener('click', () => toggleMute());
    for (const z of document.querySelectorAll('.touch-only')) z.addEventListener('contextmenu', e => e.preventDefault());
    this.actLbl = document.getElementById('actLbl'); this.waterLbl = document.getElementById('waterLbl');
    this.pauseBtn = document.getElementById('pauseBtn');
  },
  // Etiquetas de los botones según lo que hace E en este momento
  sync() {
    if (!this.on) return;
    let lbl;
    if (Game.state === 'paused') lbl = 'Seguir';
    else if (Game.state !== 'play') lbl = 'OK';
    else if (Game.dialog) lbl = 'Seguir';
    else {
      const k = Game.prompt && Game.prompt.kind;
      lbl = k === 'talk' ? 'Hablar' : k === 'post' ? (Game.sites.some(s => s.documented && !s.reported) ? 'Denunciar' : 'Recargar')
        : k === 'refill' ? 'Recargar' : k === 'doc' ? 'Fotografiar' : k === 'spray' ? 'Rociar' : k === 'rake' ? 'Limpiar'
        : ['Cámara', 'Rociar', 'Limpiar'][Player.tool - 1];
    }
    this.set('act', lbl, v => { this.actLbl.textContent = v; });
    this.set('water', 'Agua ' + Player.water, v => { this.waterLbl.textContent = v; });

function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g, w, h); return c; }
function px(g, x, y, col, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function speckle(g, w, h, cols, n, r) { for (let i = 0; i < n; i++) px(g, Math.floor(r() * w), Math.floor(r() * h), cols[Math.floor(r() * cols.length)]); }
function disc(g, cx, cy, rad, col) {
  g.fillStyle = col;
  for (let y = -rad; y <= rad; y++) for (let x = -rad; x <= rad; x++)
    if (x * x + y * y <= rad * rad + rad * 0.6) g.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1);
}
function ground(cols, n, seed, extra) {
  const r = mulberry32(seed);
  return mk(T, T, (g) => { px(g, 0, 0, cols[0], T, T); speckle(g, T, T, cols.slice(1), n, r); if (extra) extra(g, r); });
}

const LOOKS = {

  lucia:  { skin:'#c48a5e', shirt:'#4a8ac0', shirt2:'#36689a', pants:'#4a3a6a', hair:'#3a2216', small:true },
  logger: { skin:'#c49064', shirt:'#b43a2a', shirt2:'#8a2a1e', pants:'#2e3440', hat:'#e0a020', helmet:true, saw:true },
};
function drawPerson(g, x, y, dir, frame, look, alpha = 1) {
  x = Math.round(x); y = Math.round(y);
  const sm = look.small ? 2 : 0;
  g.globalAlpha = 0.25 * alpha; g.fillStyle = '#000'; g.fillRect(x - 5, y - 1, 10, 3); g.globalAlpha = alpha;
  const step = frame % 2 === 1 ? 1 : 0;
  // piernas
  if (dir === 1 || dir === 2) { px(g, x - 2 + (step ? 1 : -1), y - 5, look.pants, 2, 5); px(g, x + (step ? -1 : 1), y - 5, look.pants, 2, 5); }
  else { px(g, x - 3, y - 5 + (step ? -1 : 0), look.pants, 2, 5 - (step ? -1 : 0)); px(g, x + 1, y - 5 + (step ? 0 : -1), look.pants, 2, 5); }
  px(g, x - 3, y - 1, '#2a1e14', 2, 1); px(g, x + 1, y - 1, '#2a1e14', 2, 1);
  // cuerpo
  const top = y - 12 + sm;
  if (look.skirt) px(g, x - 4, y - 7, look.pants, 8, 3);
  px(g, x - 4, top, look.shirt, 8, 7 - sm); px(g, x - 4, top + 5 - sm, look.shirt2, 8, 1);
  if (look.badge && dir === 0) { px(g, x + 1, top + 1, '#e8c547'); px(g, x - 3, top + 1, '#4a5a2a', 1, 2); }
  // brazos
  const sw = frame % 2 === 1 ? 1 : -1;
  if (dir === 0 || dir === 3) { px(g, x - 6, top + 1 + sw, look.shirt2, 2, 5); px(g, x + 4, top + 1 - sw, look.shirt2, 2, 5); px(g, x - 6, top + 5 + sw, look.skin, 2, 1); px(g, x + 4, top + 5 - sw, look.skin, 2, 1); }
  else { const ax = dir === 1 ? x - 1 + sw : x - 1 - sw; px(g, ax, top + 1, look.shirt2, 2, 5); px(g, ax, top + 5, look.skin, 2, 1); }
  // motosierra
  if (look.saw) { const sx = dir === 1 ? x - 10 : x + 4; px(g, sx, top + 3, '#e07a10', 5, 3); px(g, dir === 1 ? sx - 5 : sx + 5, top + 4, '#b8b8b8', 5, 1); }
  // cabeza
  const hy = top - 6;
  px(g, x - 3, hy, look.skin, 6, 6);
  if (look.hair) { px(g, x - 3, hy - 1, look.hair, 6, 2); if (dir === 3) px(g, x - 3, hy, look.hair, 6, 5); else { px(g, x - 4, hy, look.hair, 1, 4); px(g, x + 3, hy, look.hair, 1, 4); } }
  if (dir === 0) { px(g, x - 2, hy + 2, '#1a1410'); px(g, x + 1, hy + 2, '#1a1410'); }
  else if (dir === 1) px(g, x - 2, hy + 2, '#1a1410');
  else if (dir === 2) px(g, x + 1, hy + 2, '#1a1410');
  if (look.hat) {
    if (look.helmet) { px(g, x - 4, hy - 2, look.hat, 8, 3); px(g, x - 4, hy + 1, '#a07010', 8, 1); }
    else { px(g, x - 3, hy - 3, look.hat, 6, 3); px(g, x - 6, hy, look.hat, 12, 1); px(g, x - 3, hy - 1, '#4a3418', 6, 1); }
  }
  g.globalAlpha = 1;
}

/* --- Llamas animadas sobre una casilla en llamas --- */
function drawFlames(g, x, y, t, k, intensity) {
  const n = 3;
  for (let i = 0; i < n; i++) {
    const ph = t * 9 + k * 1.7 + i * 2.1;
    const fx = x + 3 + i * 4 + Math.round(Math.sin(ph) * 1);
    const h = Math.round((5 + 6 * intensity) * (0.75 + 0.25 * Math.sin(ph * 1.3)));
    px(g, fx - 1, y + 14 - h, '#c83a12', 4, h);
    px(g, fx, y + 14 - h + 2, '#f07a1a', 3, h - 2);
    px(g, fx, y + 14 - Math.round(h * 0.5), '#ffd23a', 2, Math.round(h * 0.5) - 1);
  }
}

/* ===================== 6. MAPA Y MUNDO ===================== */
const World = {
  w: CFG.MAP_W, h: CFG.MAP_H,
  tiles: null, variant: null, orig: null, burn: null, burnMax: null, fireId: null, wet: null,
  buildings: [], initialTrees: 0,
};
// Lugares con nombre del mapa (en casillas)
const LM = {
  door: { x: 25.9, y: 29.6 },               // puerta del campamento Ñembi Misi
  pondCenter: { x: 8, y: 27 },
  clearing: { x: 21, y: 9 },
  village: { x: 43, y: 24, w: 13, h: 16 },
  heatZones: [
    { name: 'El Claro', x: 15, y: 8 },
    { name: 'Ladera Oeste', x: 5, y: 15 },
    { name: 'Quebrada Sur', x: 17, y: 37 },
    { name: 'Bosque Este', x: 40, y: 14 },
  ],
  logSites: [

    { name: 'Loma Noreste', x: 48, y: 9 },
    { name: 'Loma Noroeste', x: 7, y: 5 },
    { name: 'Quebrada Sur', x: 10, y: 36 },
    { name: 'Bosque Central', x: 35, y: 20 },
  ],
  chaco: { name: 'Chaco de Don Ramón', x: 35, y: 36 },
};
const idx = (x, y) => y * World.w + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < World.w && y < World.h;
const tileAt = (x, y) => inMap(x, y) ? World.tiles[idx(x, y)] : TL.ROCK;
function setTile(x, y, t) { if (inMap(x, y)) World.tiles[idx(x, y)] = t; }
function isSolidAt(tx, ty) {
  if (tx < 1 || ty < 1 || tx >= World.w - 1 || ty >= World.h - 1) return true; // borde del mapa
  const i = idx(tx, ty);
  if (World.burn[i] > 0) return true; // no se puede atravesar el fuego
  return TILE_INFO[World.tiles[i]].solid;
}
function inVillage(x, y) { const v = LM.village; return x >= v.x - 1 && y >= v.y - 1 && x < v.x + v.w && y < v.y + v.h; }
function countTrees() { let n = 0; for (let i = 0; i < World.tiles.length; i++) if (World.tiles[i] === TL.TREE) n++; return n; }

function genMap() {
  const W = World.w, H = World.h, N = W * H;
  World.tiles = new Uint8Array(N); World.variant = new Uint8Array(N); World.orig = new Uint8Array(N);
  World.burn = new Float32Array(N); World.burnMax = new Float32Array(N); World.fireId = new Int16Array(N); World.wet = new Float32Array(N);
  World.buildings = [];
  const r = mulberry32(20261114);
  // Ruido suave para formar manchas de bosque denso y claros naturales
  const G = 7, gw = Math.ceil(W / G) + 2, grid = [];
  for (let i = 0; i < gw * (Math.ceil(H / G) + 2); i++) grid.push(r());
  const gv = (x, y) => grid[y * gw + x];
  const noise = (x, y) => {
    const gx = x / G, gy = y / G, x0 = Math.floor(gx), y0 = Math.floor(gy);
    let fx = gx - x0, fy = gy - y0; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    return lerp(lerp(gv(x0, y0), gv(x0 + 1, y0), fx), lerp(gv(x0, y0 + 1), gv(x0 + 1, y0 + 1), fx), fy);
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = noise(x, y) * 0.75 + r() * 0.25;
    const i = idx(x, y);
    World.tiles[i] = v > 0.34 ? TL.TREE : (r() < 0.3 ? TL.BUSH : TL.GRASS);
    World.variant[i] = Math.floor(r() * 4);
  }
  const ellipse = (cx, cy, rx, ry, fn) => {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
      if (inMap(x, y) && ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) fn(x, y);
  };
  const rect = (x0, y0, w, h, t) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) setTile(x, y, t); };
  // El claro (norte)
  ellipse(LM.clearing.x, LM.clearing.y, 5.5, 4.2, (x, y) => setTile(x, y, r() < 0.1 ? TL.BUSH : TL.GRASS));
  // Laguna (oeste)
  ellipse(LM.pondCenter.x, LM.pondCenter.y, 4.6, 3.6, (x, y) => setTile(x, y, TL.GRASS));
  ellipse(LM.pondCenter.x, LM.pondCenter.y, 3.2, 2.3, (x, y) => setTile(x, y, TL.WATER));
  // Explanada del campamento Ñembi Misi
  ellipse(26, 28.5, 7, 5.5, (x, y) => setTile(x, y, TL.GRASS));
  rect(22, 29, 9, 3, TL.FLOOR);
  // Chaco de Don Ramón (pastizal seco)
  rect(35, 33, 7, 6, TL.GRASS);
  // Pueblo
  const v = LM.village;
  rect(v.x, v.y, v.w, v.h, TL.VILLAGE);
  for (let y = v.y - 1; y < H; y++) if (y !== 30 && y !== 31) { setTile(v.x - 1, y, TL.FENCE); World.variant[idx(v.x - 1, y)] = 1; }
  for (let x = v.x - 1; x < W; x++) if (x !== 49 && x !== 50) { setTile(x, v.y - 1, TL.FENCE); World.variant[idx(x, v.y - 1)] = 0; }
  // Senderos
  const carve = (pts, wd) => {
    for (let k = 0; k < pts.length - 1; k++) {
      let [x, y] = pts[k]; const [x1, y1] = pts[k + 1];
      while (x !== x1 || y !== y1) {
        for (let a = 0; a < wd; a++) for (let b = 0; b < wd; b++) {
          const t = tileAt(x + a, y + b);
          if (t !== TL.BUILDING && t !== TL.WATER && t !== TL.FENCE) setTile(x + a, y + b, TL.PATH);
        }
        if (x !== x1) x += Math.sign(x1 - x); else y += Math.sign(y1 - y);
      }
    }
  };
  carve([[26, 30], [34, 30], [34, 31], [56, 31]], 2);            // al pueblo
  carve([[30, 29], [30, 22], [24, 22], [24, 14], [22, 14], [22, 10]], 2); // al claro
  carve([[23, 30], [16, 30], [16, 28], [12, 28]], 1);            // a la laguna
  carve([[49, 23], [49, 15], [47, 15], [47, 1]], 1);             // del pueblo al monte
  carve([[24, 14], [33, 14], [33, 6]], 1);                       // sendero de patrulla norte
  // Edificios

const Player = {
  x: 0, y: 0, dir: 0, frame: 0, animT: 0, moving: false, tool: 1, water: CFG.WATER_MAX,

  reset() { this.x = LM.door.x; this.y = LM.door.y + 0.6; this.dir = 0; this.tool = 1; this.water = CFG.WATER_MAX; this.action = null; this.sprayCD = 0; },
  facingTile() { const v = [[0, 1], [-1, 0], [1, 0], [0, -1]][this.dir]; return { x: Math.floor(this.x + v[0] * 0.8), y: Math.floor(this.y - 0.2 + v[1] * 0.8) }; },
};
function collides(x, y, r) {
  const pts = [[x - r, y - 0.3], [x + r, y - 0.3], [x - r, y + 0.05], [x + r, y + 0.05]];
  for (const [px_, py_] of pts) if (isSolidAt(Math.floor(px_), Math.floor(py_))) return true;
  return false;
}
function moveEntity(e, dx, dy, r = 0.3) {
  if (dx && !collides(e.x + dx, e.y, r)) e.x += dx;
  if (dy && !collides(e.x, e.y + dy, r)) e.y += dy;
}
function animate(e, dt, moving) {
  if (moving) { e.animT += dt; if (e.animT > 0.16) { e.animT = 0; e.frame = (e.frame + 1) % 4; } } else e.frame = 0;
}

const Particles = {
  list: [],
  add(p) { if (this.list.length < 700) this.list.push(p); },
  update(dt) {
    const w = Game.windVec();
    for (const p of this.list) {
      p.life -= dt;
      if (p.kind === 'smoke') { p.vx += w.x * 6 * dt; p.vy += w.y * 6 * dt - 2 * dt; p.size += 5 * dt; }
      if (p.kind === 'drop') p.vy += 60 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    this.list = this.list.filter(p => p.life > 0);
  },
  draw(g) {
    for (const p of this.list) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.kind === 'smoke') { g.globalAlpha = a * 0.45; g.fillStyle = p.col; const s = Math.round(p.size); g.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s); }
      else if (p.kind === 'flash') { g.globalAlpha = a * 0.8; g.fillStyle = '#fff'; g.fillRect(Math.round(p.x) - 10, Math.round(p.y) - 10, 20, 20); }
      else { g.globalAlpha = a; g.fillStyle = p.col; g.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); }
    }
    g.globalAlpha = 1;
  },
};

/* ===================== 8. FUEGO ===================== */
const fuelOf = t => TILE_INFO[t].fuel;
function ignite(x, y, inc) {
  if (!inMap(x, y)) return false;
  const i = idx(x, y), t = World.tiles[i], f = fuelOf(t);
  if (!f || World.burn[i] > 0 || World.wet[i] > 0) return false;
  const bt = CFG.FIRE_BURN_TIME * (f === 'grass' ? 0.55 : f === 'bush' ? 0.7 : f === 'stump' ? 0.8 : 1) * (0.85 + rnd() * 0.3);
  World.orig[i] = t; World.burn[i] = bt; World.burnMax[i] = bt; World.fireId[i] = inc.id;
  inc.active++; inc.total++;
  return true;
}
function startFire(zone, radioText) {
  // Busca una casilla con combustible cerca del centro de la zona
  let cands = [];
  for (let r = 0; r <= 4 && cands.length === 0; r++)
    for (let y = zone.y - r; y <= zone.y + r; y++) for (let x = zone.x - r; x <= zone.x + r; x++)
      if (inMap(x, y) && fuelOf(tileAt(x, y)) && World.burn[idx(x, y)] === 0) cands.push({ x, y });
  if (!cands.length) return null;
  const c = pick(cands);
  const inc = { id: Game.incidents.length + 1, name: zone.name, x: c.x, y: c.y, active: 0, total: 0, done: false, helped: false, villageHit: false, burntTrees: 0 };
  Game.incidents.push(inc);
  ignite(c.x, c.y, inc); ignite(c.x + 1, c.y, inc); ignite(c.x, c.y + 1, inc);
  for (let i = 0; i < World.burn.length; i++)
    if (World.fireId[i] === inc.id && World.burn[i] > 0) { World.burn[i] *= CFG.FIRE_CORE_MULT; World.burnMax[i] *= CFG.FIRE_CORE_MULT; }
  msg(radioText || `Radio: ¡Columna de humo en ${zone.name}! Lleva agua o abre un cortafuego.`, 'alert');
  Sound.sfx('alert');
  return inc;
}
function douse(x, y) {
  if (!inMap(x, y)) return false;
  const i = idx(x, y); let hit = false;
  if (World.burn[i] > 0) {
    const prog = 1 - World.burn[i] / World.burnMax[i];
    const inc = Game.incidents[World.fireId[i] - 1];
    World.burn[i] = 0; inc.active--; inc.helped = true;
    if (prog > 0.6) { World.tiles[i] = TL.BURNT; if (World.orig[i] === TL.TREE) inc.burntTrees++; }
    else World.tiles[i] = World.orig[i]; // salvada a tiempo
    hit = true;
    for (let k = 0; k < 4; k++) Particles.add({ kind: 'smoke', x: x * T + 8, y: y * T + 6, vx: (rnd() - 0.5) * 8, vy: -10, size: 3, life: 1.2, max: 1.2, col: '#e8eef2' });
  }
  if (fuelOf(World.tiles[i])) World.wet[i] = Math.max(World.wet[i], 30); // la vegetación mojada no arde por un rato
  return hit;
}
const Fire = {
  update(dt) {
    const N = World.tiles.length;
    for (let i = 0; i < N; i++) {
      if (World.wet[i] > 0) World.wet[i] = Math.max(0, World.wet[i] - dt);
      if (World.burn[i] > 0) {
        World.burn[i] -= dt;
        if (rnd() < dt * 1.6) {
          const x = i % World.w, y = Math.floor(i / World.w);
          Particles.add({ kind: 'smoke', x: x * T + 4 + rnd() * 8, y: y * T - 6, vx: 0, vy: -8, size: 3 + rnd() * 3, life: 2.5 + rnd() * 1.5, max: 4, col: rnd() < 0.5 ? '#6a6a6a' : '#8c8c8c' });
          if (rnd() < 0.3) Particles.add({ kind: 'spark', x: x * T + 8, y: y * T, vx: (rnd() - 0.5) * 20, vy: -20 - rnd() * 20, size: 1, life: 0.7, max: 0.7, col: '#ffcf4a' });
        }
        if (World.burn[i] <= 0) this.burnOut(i);
      }
    }
    Game.fireTimer += dt;
    while (Game.fireTimer >= CFG.FIRE_TICK) { Game.fireTimer -= CFG.FIRE_TICK; this.spread(); }
    for (const inc of Game.incidents) {
      if (!inc.done && inc.total > 0 && inc.active <= 0) {
        inc.done = true; inc.endClock = Game.clock;
        if (inc.helped) { msg(`Incendio de ${inc.name} controlado. ¡Buen trabajo!`, 'good'); Game.addTrust(4); Sound.sfx('success'); }
        else msg(`El incendio de ${inc.name} se apagó solo al quedarse sin combustible.`, 'info');
      }
    }
  },
  burnOut(i) {
    const inc = Game.incidents[World.fireId[i] - 1];
    World.burn[i] = 0; World.tiles[i] = TL.BURNT;
    if (inc) { inc.active--; if (World.orig[i] === TL.TREE) inc.burntTrees++; }
  },
  spread() {
    const w = Game.windVec(), W = World.w;
    const burning = [];
    for (let i = 0; i < World.tiles.length; i++) if (World.burn[i] > 0) burning.push(i);
    for (const i of burning) {
      const x = i % W, y = Math.floor(i / W);
      const inc = Game.incidents[World.fireId[i] - 1];
      const prog = 1 - World.burn[i] / World.burnMax[i];
      const inten = 0.35 + Math.sin(prog * Math.PI) * 0.65;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (!inMap(nx, ny)) continue;
        const ni = idx(nx, ny), f = fuelOf(World.tiles[ni]);
        if (!f || World.burn[ni] > 0 || World.wet[ni] > 0) continue;
        const len = Math.hypot(dx, dy);
        const wf = clamp(1 + 1.5 * (dx * w.x + dy * w.y) / len, 0.08, 2.6);
        const p = CFG.SPREAD[f] * wf * Game.dryness * inten * (len > 1 ? 0.6 : 1);
        if (rnd() < p) ignite(nx, ny, inc);
      }
      if (inc && !inc.villageHit && x >= LM.village.x - 3 && y >= LM.village.y - 3) {
        inc.villageHit = true; Game.addTrust(-8);
        msg('¡El fuego llegó al borde del pueblo! Los vecinos están asustados.', 'alert'); Sound.sfx('alert');
      }
    }
  },
  nearestBurning(x, y, maxD) {
    let best = null, bd = maxD;
    for (let i = 0; i < World.tiles.length; i++) if (World.burn[i] > 0) {
      const d = dist(x, y, i % World.w + 0.5, Math.floor(i / World.w) + 0.5);
      if (d < bd) { bd = d; best = { x: i % World.w, y: Math.floor(i / World.w), d }; }
    }
    return best;
  },
};

// --- Tala ilegal ---
function cutTree(s) {
  let best = null, bd = 1e9;
  for (let y = s.y - 4; y <= s.y + 4; y++) for (let x = s.x - 4; x <= s.x + 4; x++) {
    if (!inMap(x, y) || tileAt(x, y) !== TL.TREE || World.burn[idx(x, y)] > 0) continue;
    const d = dist(x, y, s.x, s.y) + rnd() * 1.5;
    if (d < bd) { bd = d; best = { x, y }; }
  }
  if (best) { setTile(best.x, best.y, TL.STUMP); s.stumps.push(best); }
  return best;
}
function startLogging(n) {
  const s = Game.sites[n]; if (!s) return;
  s.active = true;
  for (let k = 0; k < 3; k++) cutTree(s);
  Game.loggers.push({ x: s.x + 0.5, y: s.y + 0.9, dir: 0, frame: 0, animT: 0, state: 'cutting', cutT: 3, sawT: 0.3, heardT: 0, site: s, life: 70 });
  if (Game.trust >= CFG.TIP_TRUST) {
    s.known = true;
    msg(`Un vecino avisa por radio: hay motosierras en ${s.name}. (Lo marqué en el mapa)`, 'radio'); Sound.sfx('radio');
  }
}
function updateLoggers(dt) {
  for (const L of Game.loggers) {
    if (L.state === 'gone') continue;
    const d = dist(L.x, L.y, Player.x, Player.y);
    if (L.state === 'cutting') {
      L.life -= dt; L.cutT -= dt; L.sawT -= dt; L.heardT -= dt;
      if (L.sawT <= 0) {
        L.sawT = 2.8;
        if (d < 24) Sound.chainsaw(clamp(1 - d / 24, 0, 1));
        if (d < 22 && L.heardT <= 0) {
          L.heardT = 18;
          msg(`Se escucha una motosierra hacia el ${DIR_NAMES[dirIndex(L.x - Player.x, L.y - Player.y)]}.`, 'warn');
        }
      }
      if (L.cutT <= 0) {
        L.cutT = 6;
        const t = cutTree(L.site);
        if (t) { L.x = t.x + 0.5 + (t.x < L.site.x ? 0.9 : -0.9); L.y = t.y + 0.9; L.dir = t.x < L.site.x ? 1 : 2; if (d < 14) Sound.sfx('chop'); }
      }
      animate(L, dt, false);
      if (d < 5.5) {
        L.state = 'fleeing'; L.site.discovered = true; L.site.known = true;
        msg('¡Sorprendiste a los taladores y huyeron! Documenta el claro: herramienta 1 y mantén E.', 'alert'); Sound.sfx('alert');
      } else if (L.life <= 0) L.state = 'fleeing';
    } else if (L.state === 'fleeing') {
      let ax = L.x - Player.x, ay = L.y - Player.y; const al = Math.hypot(ax, ay) || 1;
      ax /= al; ay /= al;
      L.x = clamp(L.x + ax * 5.5 * dt, 0.5, World.w - 0.5); L.y = clamp(L.y + ay * 5.5 * dt, 0.5, World.h - 0.5);
      L.dir = Math.abs(ax) > Math.abs(ay) ? (ax < 0 ? 1 : 2) : (ay < 0 ? 3 : 0);
      animate(L, dt, true);
      if (d > 18 || L.x <= 0.6 || L.y <= 0.6 || L.x >= World.w - 0.6 || L.y >= World.h - 0.6) L.state = 'gone';
    }
  }
  // Encontrar un claro talado cuando los taladores ya se fueron
  for (const s of Game.sites) {
    if (!s.active || s.discovered || !s.stumps.length) continue;
    if (s.stumps.some(t => dist(Player.x, Player.y, t.x + 0.5, t.y + 0.5) < 5)) {
      s.discovered = true; s.known = true;
      msg(`Encontraste un claro recién talado en ${s.name}. Documéntalo con la cámara (1).`, 'warn'); Sound.sfx('alert');
    }
  }
}

function newGame() {
  genMap(); Player.reset(); resetNPCs(); Particles.list = [];
  Object.assign(Game, {
    clock: CFG.DAY_START, trust: CFG.TRUST_START, reports: 0, waterUsed: 0, breaks: 0, treesCutForBreak: 0,
    messages: [], incidents: [], loggers: [], dialog: null, prompt: null, fireTimer: 0, crackleT: 0,
    ramonConvinced: false, ramonFired: false, summary: null,
    windFrom: pick([0, 1, 2, 7]), windStr: 0.85 + rnd() * 0.35, humidity: ri(12, 22), dryness: 1.15,
  });
  Game.heat = shuffle(LM.heatZones.slice()).slice(0, 2);
  Game.sites = shuffle(LM.logSites.filter(s => !Game.heat.some(h => h.name === s.name))).slice(0, 3)
    .map(s => ({ ...s, active: false, discovered: false, known: false, documented: false, reported: false, stumps: [], docStumps: 0 }));
  Game.events = buildSchedule();
  Game.briefing = makeBriefing();

  updateCamera();
}
function endDay() {

  Sound.sfx('end');

function setTool(n) { if (Player.tool !== n) { Player.tool = n; Player.action = null; Sound.sfx('select'); } }
function toggleMute() {
  Sound.init(); Sound.setMuted(!Sound.muted);
  muteBtn.textContent = Sound.muted ? 'Sonido: silenciado' : 'Sonido: activado';
  muteBtn.setAttribute('aria-pressed', String(Sound.muted));

// Tocar o hacer clic en el juego: avanza menús y diálogos
function canvasTap(x, y) {
  if (Game.stateT < 0.4) return;
  switch (Game.state) {
    case 'title': Input.tap(y > 306 && y < 356 && Math.abs(x - CFG.W / 2) < 200 ? 'c' : 'enter'); break;
    case 'controls': case 'briefing': Input.tap('enter'); break;
    case 'summary': if (Game.stateT > 1.5) Input.tap('enter'); break;
    case 'paused': Input.tap('p'); break;
    case 'play': if (Game.dialog) Input.tap('e'); break;
  }
}
function updatePlay(dt) {
  Game.clock += dt * MIN_PER_SEC;
  if (Game.clock >= CFG.DAY_END) { Game.clock = CFG.DAY_END; endDay(); return; }
  runEvents();
  if (Input.hit('1')) setTool(1); if (Input.hit('2')) setTool(2); if (Input.hit('3')) setTool(3);
  let mx = 0, my = 0;
  if (Input.isDown('arrowleft', 'a')) mx -= 1;
  if (Input.isDown('arrowright', 'd')) mx += 1;
  if (Input.isDown('arrowup', 'w')) my -= 1;
  if (Input.isDown('arrowdown', 's')) my += 1;
  if (Math.hypot(Touch.jx, Touch.jy) > 0.22) { mx += Touch.jx; my += Touch.jy; } // joystick táctil
  const moving = !!(mx || my);
  if (moving) {
    const l = Math.hypot(mx, my), mag = Math.min(1, l * 1.2);
    const ti = TILE_INFO[tileAt(Math.floor(Player.x), Math.floor(Player.y - 0.1))];
    const sp = CFG.PLAYER_SPEED * (ti.speed || 1) * dt * mag;
    moveEntity(Player, mx / l * sp, my / l * sp);
    const hd = mx < 0 ? 1 : 2, vd = my < 0 ? 3 : 0, ax = Math.abs(mx), ay = Math.abs(my);
    if (ax > ay * 1.2) Player.dir = hd; else if (ay > ax * 1.2) Player.dir = vd;
    else if (Player.dir !== hd && Player.dir !== vd) Player.dir = vd;
    Player.stepT -= dt; if (Player.stepT <= 0) { Player.stepT = 0.32; Sound.sfx('step'); }
  }
  animate(Player, dt, moving);
  updateTools(dt);
  updateNPCs(dt); updateLoggers(dt); Fire.update(dt); Particles.update(dt);
  for (const m of Game.messages) m.t += dt;
  Game.messages = Game.messages.filter(m => m.t < 9);
  Game.crackleT -= dt;
  if (Game.crackleT <= 0) { Game.crackleT = 0.6; const nb = Fire.nearestBurning(Player.x, Player.y, 10); if (nb) Sound.sfx('crackle', clamp(1 - nb.d / 10, 0.15, 1)); }
  updateCamera();
}
function update(dt) {
  if (Game.state !== Game.lastState) { Game.lastState = Game.state; Game.stateT = 0; }
  Game.stateT += dt;
  if (Input.hit('m')) toggleMute();
  switch (Game.state) {
    case 'title':
      cam.x = (Math.sin(Game.time * 0.05) * 0.5 + 0.5) * (World.w * T - VIEW_W);
      cam.y = (Math.cos(Game.time * 0.04) * 0.5 + 0.5) * (World.h * T - VIEW_H);
      Fire.update(dt); Particles.update(dt);
      if (Input.hit('enter', ' ')) { newGame(); Sound.sfx('select'); }
      else if (Input.hit('c')) { Game.state = 'controls'; Sound.sfx('blip'); }
      break;
    case 'controls':
      if (Input.hit('enter', ' ')) { newGame(); Sound.sfx('select'); }
      else if (Input.hit('escape', 'c')) { Game.state = 'title'; Sound.sfx('blip'); }
      break;
    case 'briefing':
      if (Input.hit('enter', ' ', 'e')) { Game.state = 'play'; Sound.sfx('select'); msg('Sal a patrullar: mira el humo, escucha el monte y decide a dónde ir primero.', 'radio'); }
      break;
    case 'play':
      if (Input.hit('p', 'escape')) { Game.state = 'paused'; Sound.sfx('blip'); break; }
      if (Game.dialog) { updateDialog(dt); Game.prompt = null; break; }
      updatePlay(dt);
      break;
    case 'paused':
      if (Input.hit('p', 'escape', 'enter')) { Game.state = 'play'; Sound.sfx('blip'); }
      break;
    case 'summary':
      if (Input.hit('enter') && Game.stateT > 1.2) { newGame(); Sound.sfx('select'); } // pausa breve para leer el resumen
      break;
  }
}
function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CFG.W, CFG.H);
  renderWorld(ctx);
  drawTint(ctx);
  switch (Game.state) {
    case 'title': drawTitle(ctx); break;
    case 'controls': drawControls(ctx); break;
    case 'briefing': drawBriefing(ctx); break;
    case 'summary': drawSummary(ctx); break;
    default:
      drawHUD(ctx);
      if (Game.dialog) drawDialog(ctx);
      if (Game.state === 'paused') drawPause(ctx);
  }
}
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0); lastT = now;
  Game.time += dt;
  try { update(dt); render(); Touch.sync(); } catch (err) { console.error(err); }
  Input.endFrame();
  requestAnimationFrame(frame);
}
function init() {
  buildSprites(); genMap(); resetNPCs(); Player.reset();
  // Fondo de la pantalla de título: un pequeño fuego lejano para dar ambiente
  Game.heat = LM.heatZones.slice(0, 2);
  Input.init(); Touch.init();
  muteBtn.addEventListener('click', () => { toggleMute(); canvas.focus(); });
  canvas.addEventListener('pointerdown', e => {
    canvas.focus(); Sound.init(); Sound.resume();
    const r = canvas.getBoundingClientRect();
    canvasTap((e.clientX - r.left) * CFG.W / r.width, (e.clientY - r.top) * CFG.H / r.height);
  });
  canvas.focus();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}
// Acceso para pruebas desde la consola
window.__ranger = { Game, Player, World, Fire, LM, NPCS: () => NPCS, newGame, startFire, startLogging, endDay,
  Touch, canvasTap,
  step(n = 1, dt = 1 / 60) { for (let k = 0; k < n; k++) { Game.time += dt; update(dt); Input.endFrame(); } render(); Touch.sync(); } };
init();
</script>
